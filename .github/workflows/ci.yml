name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit & integration tests
        run: pnpm -r test

      - name: Build web app
        run: pnpm --filter @secret-share/web build

      - name: Build CLI
        run: pnpm --filter shareasecret build

      - name: Install Playwright Chromium
        run: pnpm --filter @secret-share/web exec playwright install --with-deps chromium

      # The whole optical path — fountain encode -> QR render -> zxing-wasm
      # decode -> fountain decode -> container open — runs canvas-to-canvas
      # in a real Chromium, plaintext and encrypted, no camera needed.
      - name: Optical loopback e2e
        run: node apps/web/test/optical-loopback.mjs

      # White-label tenancy: SSO-gated send, guest-grant loop (mint -> guest
      # send -> employee claim -> one-time enforcement), and the public-host
      # regression (no auth traffic, stock branding). Spawns its own wrangler
      # dev on :8788 and seeds the local KV registry itself.
      - name: Tenant white-label e2e
        run: node apps/web/test/tenant-grant.mjs

      # The read-once lifecycle guarantees (drop survival on failed --output,
      # capture-safe stderr, claim-once) live in the e2e script — run it here
      # against a real wrangler dev so they can't regress silently.
      - name: CLI lifecycle e2e (wrangler dev)
        run: |
          pnpm dev:api &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ >/dev/null && break || sleep 1; done
          node apps/cli/test/manual-cli.mjs
