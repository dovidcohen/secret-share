name: Publish CLI

# Publishes apps/cli to npm via OIDC trusted publishing — no token stored
# anywhere, and npm generates a provenance attestation automatically.
# Requires the trusted publisher registered on npmjs.com for `shareasecret`:
# owner dovidcohen, repo secret-share, workflow publish.yml.
#
# Everything that runs in this job is pinned — actions by commit SHA, npm by
# exact version — because provenance attests what built the package, not that
# a mutable tag or `latest` dependency wasn't compromised.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; exact-pinned, not @latest.
      - name: Pin npm
        run: npm install -g npm@12.0.2 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs typecheck + tests + build before anything uploads.
      - name: Publish shareasecret
        working-directory: apps/cli
        run: npm publish
